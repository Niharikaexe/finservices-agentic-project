[project]
name = "fsa-guardrails"
version = "0.0.0"
description = "Argus guardrails: UntrustedText, rails, PII redaction"
requires-python = ">=3.12"
dependencies = ["fsa-common", "fsa-telemetry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_guardrails"]

[tool.uv.sources]
fsa-common = { workspace = true }
fsa-telemetry = { workspace = true }
