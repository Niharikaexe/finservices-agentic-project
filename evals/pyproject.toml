[project]
name = "fsa-evals"
version = "0.0.0"
description = "Argus evaluation harness and release gates"
requires-python = ">=3.12"
dependencies = ["fsa-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_evals"]

[tool.uv.sources]
fsa-common = { workspace = true }
