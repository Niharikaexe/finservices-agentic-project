groups:
  - name: argus-recording
    rules:
      - record: guardrail:trip_rate:5m
        expr: sum by (rail) (rate(guardrail_trips_total{action!="allow"}[5m]))
      - record: authz:deny_rate:5m
        expr: sum by (resource_type) (rate(authz_decisions_total{decision="deny"}[5m]))
      # The metric a hiring manager actually cares about: cost per business
      # transaction, not cost per month. Almost nobody builds it.
      - record: llm:cost_per_completed_triage:1h
        expr: |
          sum(rate(llm_cost_usd_total{workflow="expense_triage"}[1h]))
          / clamp_min(sum(rate(expenses_total{outcome!="pending"}[1h])), 0.001)

  - name: argus-alerts
    rules:
      - alert: GuardrailBypassSuspected
        # A rail that stops tripping while traffic is normal is usually failing open,
        # not succeeding. Alerting on the ABSENCE of activity is the unusual half.
        expr: |
          sum(rate(guardrail_trips_total{rail="injection",action!="allow"}[30m])) == 0
          and sum(rate(agent_tool_calls_total[30m])) > 0.1
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Injection rail has not tripped in 30m while traffic is normal"
          runbook: "docs/runbooks/guardrail-silent-failure.md"

      - alert: CrossTenantDenySpike
        expr: sum(rate(authz_decisions_total{decision="deny"}[5m])) > 3 * sum(rate(authz_decisions_total{decision="deny"}[1h] offset 1h))
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Authorisation denials 3x above baseline — possible ACL probing"
          runbook: "docs/runbooks/acl-probe.md"

      - alert: AuthzFailClosed
        expr: sum(rate(authz_decisions_total{decision="fail_closed"}[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Trust plane unavailable — requests are being denied"
          runbook: "docs/runbooks/checkpointer-down.md"

      - alert: LLMCostBurn
        expr: sum(rate(llm_cost_usd_total[1h])) * 24 * 3600 > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Projected daily LLM spend above budget"
          runbook: "docs/runbooks/cost-burn.md"
