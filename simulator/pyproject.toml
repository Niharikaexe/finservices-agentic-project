[project]
name = "fsa-sim"
version = "0.0.0"
description = "Argus synthetic world, traffic, adversarial and chaos simulator"
requires-python = ">=3.12"
dependencies = ["fsa-common", "numpy>=1.26", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_sim"]

[tool.uv.sources]
fsa-common = { workspace = true }
