[project]
name = "fsa-gateway"
version = "0.0.0"
description = "Argus model gateway: vendor-neutral routing, cost control, full interaction capture"
requires-python = ">=3.12"
dependencies = ["fsa-common", "fsa-telemetry", "fsa-guardrails", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_gateway"]

[tool.uv.sources]
fsa-common = { workspace = true }
fsa-telemetry = { workspace = true }
fsa-guardrails = { workspace = true }
