[project]
name = "fsa-retrieval"
version = "0.0.0"
description = "Argus permission-aware retrieval: chunking, embedding, vector stores"
requires-python = ">=3.12"
dependencies = ["fsa-common", "fsa-authz", "numpy>=1.26", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_retrieval"]

[tool.uv.sources]
fsa-common = { workspace = true }
fsa-authz = { workspace = true }
