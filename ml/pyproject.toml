[project]
name = "fsa-ml"
version = "0.0.0"
description = "Argus ML platform: features, fraud, forecast, drift, registry"
requires-python = ">=3.12"
dependencies = ["fsa-common", "numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_ml"]

[tool.uv.sources]
fsa-common = { workspace = true }
