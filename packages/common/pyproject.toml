[project]
name = "fsa-common"
version = "0.0.0"
description = "Argus shared kernel: settings, logging, Money, errors"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.4", "structlog>=24.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa_common"]
